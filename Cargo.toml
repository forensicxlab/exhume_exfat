[package]
name = "exhume_exfat"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Extract exFAT Filesystem specific artefacts from a given Partition."
documentation = "https://www.forensicxlab.com/docs/exhume_exfat/getting-started"
authors = ["k1nd0ne"]
repository = "https://github.com/forensicxlab/exhume_exfat"
license = "GPL-3.0-only"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prettytable = "0.10"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["cargo"] }
clap-num = "1"
exhume_body = "=0.6.0"
thiserror = "2.0.17"

[dev-dependencies]
anyhow = "1"
